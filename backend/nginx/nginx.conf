events {
  worker_connections 1024;
}

http {
  # Docker's embedded DNS returns every active `api` replica and is queried
  # again when containers are replaced or scaled.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  upstream fastapi_replicas {
    zone fastapi_replicas 64k;
    server api:8000 resolve;
  }

  server {
    listen 80;
    server_name _;

    location / {
      proxy_pass http://fastapi_replicas;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_read_timeout 3600s;
    }
  }
}
