# Settings shared by every process of the backend image.
x-backend: &backend
  build: .
  image: ingestion-backend
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_DB: ${POSTGRES_DB:-ingestion}
    POSTGRES_USER: ${POSTGRES_USER:-ingestion}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ingestion}
    CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-ingestion}:${RABBITMQ_PASSWORD:-ingestion}@rabbitmq:5672//
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT_URL: http://floci:4566
    S3_BROWSER_ENDPOINT_URL: http://localhost:${FLOCI_PORT:-4566}
    # Floci accepts any credentials.
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    AWS_DEFAULT_REGION: us-east-1
    # The page and the API share this origin through nginx.
    REACT_ORIGIN: http://localhost:${APP_PORT:-8000}

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ingestion}
      POSTGRES_USER: ${POSTGRES_USER:-ingestion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ingestion}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ingestion}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-ingestion}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 1G

  redis:
    image: redis:8
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  floci:
    image: floci/floci:2.3.0
    environment:
      # The default, memory, loses every object when the container stops.
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
    ports:
      - "${FLOCI_PORT:-4566}:4566"
    volumes:
      - floci_data:/app/data
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 1G

  floci-init:
    <<: *backend
    command: ["python", "-m", "app.scripts.init_s3"]
    depends_on:
      floci:
        condition: service_started
    restart: "no"

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    depends_on: &backend-dependencies
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      floci-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready').read()"]
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.75"
          memory: 1G

  worker:
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--without-mingle", "--without-gossip"]
    depends_on: *backend-dependencies
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M

  frontend:
    build: ../frontend
    image: ingestion-frontend
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

volumes:
  postgres_data:
  floci_data:
