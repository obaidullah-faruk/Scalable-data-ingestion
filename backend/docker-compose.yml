services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ingestion}
      POSTGRES_USER: ${POSTGRES_USER:-ingestion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ingestion}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ingestion}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-ingestion}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 1G

  redis:
    image: redis:8
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  floci:
    image: floci/floci:latest
    ports:
      - "${FLOCI_PORT:-4566}:4566"
    volumes:
      - floci_data:/app/data
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 1G

  api:
    build:
      context: .
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ingestion}:${POSTGRES_PASSWORD:-ingestion}@${POSTGRES_CONTAINER_HOST:-postgres}:5432/${POSTGRES_DB:-ingestion}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-30}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1800}
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-ingestion}:${RABBITMQ_PASSWORD:-ingestion}@${RABBITMQ_CONTAINER_HOST:-rabbitmq}:5672//
      REDIS_URL: redis://${REDIS_CONTAINER_HOST:-redis}:6379/0
      FLOCI_ENDPOINT_URL: ${FLOCI_CONTAINER_ENDPOINT_URL:-http://floci:4566}
      AWS_ACCESS_KEY_ID: ${FLOCI_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${FLOCI_SECRET_ACCESS_KEY:-test}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      floci:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 1G

  worker:
    build:
      context: .
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--without-mingle", "--without-gossip"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ingestion}:${POSTGRES_PASSWORD:-ingestion}@${POSTGRES_CONTAINER_HOST:-postgres}:5432/${POSTGRES_DB:-ingestion}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-30}
      DB_POOL_RECYCLE_SECONDS: ${DB_POOL_RECYCLE_SECONDS:-1800}
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-ingestion}:${RABBITMQ_PASSWORD:-ingestion}@${RABBITMQ_CONTAINER_HOST:-rabbitmq}:5672//
      REDIS_URL: redis://${REDIS_CONTAINER_HOST:-redis}:6379/0
      FLOCI_ENDPOINT_URL: ${FLOCI_CONTAINER_ENDPOINT_URL:-http://floci:4566}
      AWS_ACCESS_KEY_ID: ${FLOCI_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${FLOCI_SECRET_ACCESS_KEY:-test}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      floci:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M

volumes:
  postgres_data:
  floci_data:
